<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <style>
    .card{fill:#fff;stroke:#E2E8F0;stroke-width:1}
    .lbl{font-size:14px;fill:#1F2D3D}
    .lbl.danger{fill:#B42318}
    .sep{stroke:#E2E8F0;stroke-width:1}
    .ic{fill:none;stroke:#475569;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .ic.danger{stroke:#B42318}
    .cap{font-size:12px;fill:#4A5568;font-weight:600}
    .kebab{fill:#94A3B8}
  </style>

  <!-- ============ A · Owned latest ============ -->
  <text class="cap" x="20" y="16">Owned · latest</text>
  <circle class="kebab" cx="300" cy="34" r="1.7"/><circle class="kebab" cx="300" cy="40" r="1.7"/><circle class="kebab" cx="300" cy="46" r="1.7"/>
  <rect class="card" x="20" y="56" width="300" height="276" rx="12"/>
  <!-- opentab -->
  <g transform="translate(36,74)"><path class="ic" d="M9 2.5h4.5V7"/><path class="ic" d="M13.5 2.5L7.5 8.5"/><path class="ic" d="M12 9.5V12a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 2 12V5a1.5 1.5 0 0 1 1.5-1.5H6"/></g>
  <text class="lbl" x="70" y="90">Open in new tab</text>
  <!-- edit -->
  <g transform="translate(36,116)"><path class="ic" d="M11 2l3 3-9 9H2v-3L11 2z"/></g>
  <text class="lbl" x="70" y="132">Edit</text>
  <!-- clone -->
  <g transform="translate(36,158)"><rect class="ic" x="2" y="4" width="9" height="10" rx="1.5"/><path class="ic" d="M5 4V3a1 1 0 011-1h7a1 1 0 011 1v9a1 1 0 01-1 1h-1"/></g>
  <text class="lbl" x="70" y="174">Clone</text>
  <!-- share -->
  <g transform="translate(36,200)"><circle class="ic" cx="4" cy="8" r="1.9"/><circle class="ic" cx="12" cy="3.5" r="1.9"/><circle class="ic" cx="12" cy="12.5" r="1.9"/><path class="ic" d="M5.7 7.1l4.6-2.6M5.7 8.9l4.6 2.6"/></g>
  <text class="lbl" x="70" y="216">Share</text>
  <!-- download -->
  <g transform="translate(36,242)"><path class="ic" d="M8 2v7.5M5 7l3 3 3-3M3 13.5h10"/></g>
  <text class="lbl" x="70" y="258">Download test input</text>
  <!-- divider -->
  <line class="sep" x1="32" y1="288" x2="308" y2="288"/>
  <!-- delete -->
  <g transform="translate(36,298)"><path class="ic danger" d="M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 10h8l1-10"/></g>
  <text class="lbl danger" x="70" y="314">Delete</text>

  <!-- ============ B · Previous version ============ -->
  <text class="cap" x="384" y="16">Previous version · owned</text>
  <circle class="kebab" cx="664" cy="34" r="1.7"/><circle class="kebab" cx="664" cy="40" r="1.7"/><circle class="kebab" cx="664" cy="46" r="1.7"/>
  <rect class="card" x="384" y="56" width="300" height="150" rx="12"/>
  <g transform="translate(400,74)"><path class="ic" d="M9 2.5h4.5V7"/><path class="ic" d="M13.5 2.5L7.5 8.5"/><path class="ic" d="M12 9.5V12a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 2 12V5a1.5 1.5 0 0 1 1.5-1.5H6"/></g>
  <text class="lbl" x="434" y="90">Open in new tab</text>
  <g transform="translate(400,116)"><rect class="ic" x="2" y="4" width="9" height="10" rx="1.5"/><path class="ic" d="M5 4V3a1 1 0 011-1h7a1 1 0 011 1v9a1 1 0 01-1 1h-1"/></g>
  <text class="lbl" x="434" y="132">Clone</text>
  <g transform="translate(400,158)"><path class="ic" d="M3.2 5.2A5.5 5.5 0 1 1 2.5 8"/><path class="ic" d="M2 3v3h3"/><path class="ic" d="M8 5.3V8l2 1.2"/></g>
  <text class="lbl" x="434" y="174">Restore this version</text>

  <!-- ============ C · Shared-to-me ============ -->
  <text class="cap" x="20" y="370">Shared-to-me</text>
  <circle class="kebab" cx="300" cy="388" r="1.7"/><circle class="kebab" cx="300" cy="394" r="1.7"/><circle class="kebab" cx="300" cy="400" r="1.7"/>
  <rect class="card" x="20" y="410" width="300" height="108" rx="12"/>
  <g transform="translate(36,428)"><path class="ic" d="M9 2.5h4.5V7"/><path class="ic" d="M13.5 2.5L7.5 8.5"/><path class="ic" d="M12 9.5V12a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 2 12V5a1.5 1.5 0 0 1 1.5-1.5H6"/></g>
  <text class="lbl" x="70" y="444">Open in new tab</text>
  <g transform="translate(36,470)"><rect class="ic" x="2" y="4" width="9" height="10" rx="1.5"/><path class="ic" d="M5 4V3a1 1 0 011-1h7a1 1 0 011 1v9a1 1 0 01-1 1h-1"/></g>
  <text class="lbl" x="70" y="486">Clone</text>

  <!-- ============ D · Draft ============ -->
  <text class="cap" x="384" y="370">Draft</text>
  <circle class="kebab" cx="664" cy="388" r="1.7"/><circle class="kebab" cx="664" cy="394" r="1.7"/><circle class="kebab" cx="664" cy="400" r="1.7"/>
  <rect class="card" x="384" y="410" width="300" height="120" rx="12"/>
  <g transform="translate(400,428)"><path class="ic" d="M11 2l3 3-9 9H2v-3L11 2z"/></g>
  <text class="lbl" x="434" y="444">Edit</text>
  <line class="sep" x1="396" y1="470" x2="672" y2="470"/>
  <g transform="translate(400,480)"><path class="ic danger" d="M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 10h8l1-10"/></g>
  <text class="lbl danger" x="434" y="496">Delete</text>
</svg>
