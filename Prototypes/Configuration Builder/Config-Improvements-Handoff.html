<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tokenization Config — Developer Hand-off</title>
<style>
  :root{
    --navy:#1F2D3D; --slate:#4A5568; --blue:#2B6CB0; --blue-bg:#EBF2FA;
    --line:#E2E8F0; --bg:#F7FAFC; --card:#FFFFFF; --code:#F1F5F9;
    --green:#1F7C53; --green-bg:#E6F4EE; --amber:#8A6D00; --amber-bg:#FEF7E0; --red:#B42318; --red-bg:#FDECEA;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--navy);background:var(--bg);line-height:1.55}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 24px 80px}
  /* header */
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
  .top h1{font-size:24px;margin:0 0 4px}
  .top p{margin:0;color:var(--slate);font-size:13px;max-width:640px}
  .proto-btn{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;white-space:nowrap}
  .proto-btn:hover{text-decoration:none;background:#16202c}
  /* filters */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--slate);cursor:pointer}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:box-shadow .12s,transform .12s;display:block}
  .card:hover{box-shadow:0 6px 18px rgba(31,45,61,.10);transform:translateY(-1px);text-decoration:none}
  .card .cid{font-family:var(--mono);font-size:12px;color:var(--blue);font-weight:700}
  .card h3{margin:4px 0 8px;font-size:15px;color:var(--navy)}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px}
  .badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
  .b-area{background:var(--blue-bg);color:var(--blue)}
  .b-p1{background:var(--red-bg);color:var(--red)} .b-p2{background:var(--amber-bg);color:var(--amber)}
  .b-p3{background:#EEF2F7;color:var(--slate)} .b-p4{background:#EEF2F7;color:var(--slate)}
  .b-eff{background:#EDE9FE;color:#6D28D9}
  .b-pres{background:var(--green-bg);color:var(--green)} .b-state{background:var(--amber-bg);color:var(--amber)} .b-cross{background:var(--red-bg);color:var(--red)}
  /* detail */
  .crumb{font-size:13px;color:var(--slate);margin-bottom:14px}
  .detail-head h2{font-size:22px;margin:2px 0 10px}
  .detail-head .cid{font-family:var(--mono);font-size:13px;color:var(--blue);font-weight:700}
  .detail-head .meta{margin-bottom:18px}
  section.blk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
  section.blk h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate)}
  section.blk p{margin:0 0 10px}
  ul.tight{margin:0;padding-left:20px} ul.tight li{margin:4px 0}
  .file{font-family:var(--mono);font-size:12.5px;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--navy);white-space:nowrap}
  .filerow{display:flex;gap:10px;align-items:flex-start;margin:8px 0;flex-wrap:wrap}
  .filerow .note{color:var(--slate);font-size:13px;flex:1;min-width:220px}
  .ds{display:inline-block;font-family:var(--mono);font-size:12px;background:#fff;border:1px solid var(--blue);color:var(--blue);border-radius:6px;padding:2px 8px;margin:0 6px 6px 0}
  .callout{border-left:3px solid var(--amber);background:var(--amber-bg);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;color:#5c4a00}
  .callout.cross{border-color:var(--red);background:var(--red-bg);color:#7a1d12}
  .dep a{font-family:var(--mono);font-size:12.5px}
  .protolink{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;background:var(--blue-bg);color:var(--blue);padding:8px 14px;border-radius:8px}
  .protolink:hover{text-decoration:none;background:#dfeaf7}
  /* Downloadable resources (hub) */
  .resources{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px}
  .res-h{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate);font-weight:700;margin-bottom:10px}
  .res-list{display:flex;flex-wrap:wrap;gap:10px}
  .res{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--navy);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff}
  .res:hover{background:var(--blue-bg);border-color:var(--blue)}
  .res svg{color:var(--blue);flex-shrink:0}
  .res .res-name{font-weight:600}
  .res .res-file{font-family:var(--mono);font-size:11.5px;color:var(--slate)}
  /* DS-aware file links + ds chips */
  a.file-link{color:var(--blue);text-decoration:none;display:inline-flex;align-items:center;gap:5px;background:var(--blue-bg);border-color:#c9ddf2}
  a.file-link svg{color:var(--blue)}
  a.file-link:hover{text-decoration:underline}
  a.ds.ds-link{text-decoration:none;cursor:pointer}
  a.ds.ds-link:hover{background:#dfeaf7}
  .shots{display:flex;flex-direction:column;gap:12px}
  .shot{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block;background:#fff}
  .card .thumb{width:100%;height:128px;object-fit:cover;object-position:top left;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:#fff}
  .jira{font-family:var(--mono);font-weight:700}
  .jira-blk{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .jira-blk h4{margin:0}
  .jira-btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;font-family:var(--mono);font-size:13px;font-weight:700;padding:8px 14px;border-radius:8px}
  .jira-btn:hover{text-decoration:none;background:#21568c}
  .jira-meta{font-size:12px;color:var(--slate)}
  .jira-chip{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;background:var(--blue-bg);color:var(--blue);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .hidden{display:none}
  .legend{font-size:12px;color:var(--slate);margin:0 0 18px}
  .legend b{color:var(--navy)}
  footer{margin-top:30px;color:var(--slate);font-size:12px;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>

  .cb-topbar{position:fixed;top:0;left:0;right:0;height:40px;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#1F2D3D;color:#cbd5e1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:12px}

<script>

const PROTO = "./config-page.html";

// Each improvement: change -> code map ready to implement.
const IMP = [
 {id:"IMP-01",title:"Tabs → Stepper wizard",area:"Create wizard",impact:"Modify",effort:"L",pri:"P1",bucket:"cross",

  why:"Keystone change. A linear stepper makes the flow legible and is the spine most other wizard items depend on.",
  files:[["views/ConfigurationsTask.tsx","Replace the Tabs layout + mode RadioGroup with a stepper state machine; derive step order from mode."],["designSystem/components/stepper/Stepper.tsx","Reuse the existing DS Stepper — do not build a new one."],["views/ConfigurationsTaskRouteView.tsx","Route/step sync."]],

  proto:"Create a new config and walk the stepper; switch mode to see step set change."},

 {id:"IMP-02",title:"Create on final step",area:"Create wizard",impact:"Modify",effort:"M",pri:"P1",bucket:"state",

  why:"Creation should be the natural end of the flow, not an orphan affordance triggerable mid-flow.",
  files:[["views/ConfigurationsTask.tsx","Move save CTA to the last step (handleSaveButtonClick)."],["components/configWizard/ConfigSaver.tsx","Existing save path — reuse."],["components/configWizard/ConfigCreator.tsx","Config assembly helper."]],
  ds:["UiKit.Button.Primary"],
  deps:[["IMP-01","Stepper provides the final step"]],
  ac:["No standalone Create button in the tab/step bar","Final step primary CTA = Create Configuration","Wired to the existing save endpoint"],
  proto:"Stepper → final step shows Create Configuration."},

 {id:"IMP-03",title:"Read-only by default + Edit mode",area:"Detail view",impact:"Modify",effort:"M",pri:"P1",bucket:"state",
  what:"Opening a config shows a read-only view; an Edit button unlocks the fields.",
  why:"Most opens are to review, not edit. Read-only-first prevents accidental edits and de-clutters.",
  files:[["views/ConfigurationsReadonlyRouteView.tsx","Read-only entry; render plain values."],["views/ConfigurationsEditRouteView.tsx","Edit entry; unlock fields."],["views/ConfigurationsTask.tsx","Shared body; gate edit affordances on an editing flag."],["views/ConfigurationsTitle.tsx","Header Edit toggle + Save/Cancel."]],

  deps:[["IMP-01","Shares the tab/step body"]],

 {id:"IMP-04",title:"Detail header actions + gating",area:"Detail view",impact:"Modify",effort:"M",pri:"P1",bucket:"state",

  why:"Destructive/mutating actions shouldn't be reachable from a passive read-only view.",
  files:[["views/ConfigurationsTitle.tsx","Header action bar; show/hide by rights + editing."],["components/configWizard/RowActionsMenuButton.tsx","Keep the list-row action matrix consistent with the header."],["components/configWizard/ShareConfigurationModal.tsx","Share trigger."],["components/configWizard/DeleteConfigurationModal.tsx","Delete trigger."]],
  ds:["UiKit.Button","UiKit.DotsMenu"],
  deps:[["IMP-03","Editing flag"],["IMP-24","Rights drive which actions show"]],
  ac:["Read-only: Edit, Clone, Download only","Edit: full action set; Delete & Share only in edit mode","Action set respects rights"],
  proto:"Compare header actions in read-only vs Edit."},

 {id:"IMP-05",title:"Stepper footer navigation",area:"Create wizard",impact:"New",effort:"S",pri:"P1",bucket:"pres",
  what:"Cancel (left), Back (outline, appears after step 1), Next (filled) → Create on the last step.",
  why:"Standard wizard navigation; replaces ad-hoc tab clicking.",
  files:[["views/ConfigurationsTask.tsx","Footer nav bar tied to stepper index."]],
  ds:["UiKit.Button.Secondary","UiKit.Button.Primary"],
  deps:[["IMP-01","Stepper index"]],
  ac:["Back hidden on step 1","Next advances; last step shows Create","Cancel always available"],
  proto:"Footer buttons across steps."},

 {id:"IMP-06",title:"Save → version + success banner",area:"Detail view",impact:"Modify",effort:"S",pri:"P1",bucket:"state",
  what:"Save commits, bumps the version, shows a green dismissible/auto-dismiss banner; Cancel always confirms and reverts.",
  why:"Clear positive feedback + a versioning model the user can trust.",
  files:[["components/configWizard/ConfigSaver.tsx","Commit + version bump."],["views/ConfigurationsTitle.tsx","Save/Cancel + banner trigger; reuse original* dirty snapshots for revert."]],
  ds:["UiKit AlertMessage / Alert (success)","ConfirmationDialog"],
  deps:[["IMP-03","Edit mode"]],
  ac:["Save bumps version and shows a green banner (dismiss + auto-dismiss)","Cancel confirms then reverts to the pre-edit snapshot"],
  proto:"Edit → Save (banner); Edit → Cancel (confirm)."},

 {id:"IMP-07",title:"Per-step validation dialog",area:"Create wizard",impact:"Modify",effort:"M",pri:"P2",bucket:"state",
  what:"On Next, surface validation: errors block (Close only), warnings allow continue. Retarget existing validators instead of the submit-time modal.",
  why:"Catch issues per step, not all at the end.",
  files:[["components/configWizard/ConfigurationValidationResults.tsx","Validation rendering."],["components/configWizard/QualityCheckerModal.tsx","Reuse/retarget the checks modal per step."],["views/ConfigurationsTask.tsx","Run validation on Next."]],
  ds:["Modal / ModalBody","UiKit.Button"],
  deps:[["IMP-01","Step transitions"],["IMP-29","Shares the checks UI"]],
  ac:["Errors block progression (Close only)","Warnings allow continue","Validators reused, not duplicated"],

 {id:"IMP-08",title:"Unsaved-changes guard",area:"Create + Detail",impact:"Modify",effort:"S",pri:"P2",bucket:"state",
  what:"Confirm before leaving the wizard or an edit session with unsaved changes.",
  why:"Prevents silent loss of work.",
  files:[["views/ConfigurationsTitle.tsx","Dirty detection via original* snapshots."],["views/ConfigurationsTask.tsx","Intercept navigation away."],["views/ConfigurationsEditRouteView.tsx","Route-leave guard."]],
  ds:["ConfirmationDialog"],
  deps:[["IMP-06","Shares the dirty/snapshot mechanism"]],
  ac:["Leaving with unsaved edits prompts a confirm","Clean state leaves silently"],
  proto:"Edit something, then try to leave."},

 {id:"IMP-09",title:"Mode change → reset to step 1",area:"Create wizard",impact:"Modify",effort:"S",pri:"P2",bucket:"state",
  what:"Changing mode mid-setup resets to the first step so empty steps aren’t falsely marked complete.",
  why:"Mode reshapes the step set; stale progress is misleading.",
  files:[["views/ConfigurationsTask.tsx","On mode change, recompute step order + reset index."],["views/DeID/ConfigurationModeIcons.tsx","Mode display."]],
  ds:["FormRadioList / Stepper"],
  deps:[["IMP-01","Step order is mode-derived"]],
  ac:["Changing mode returns to step 1","Steps that no longer apply are dropped"],
  proto:"Change mode mid-wizard."},

 {id:"IMP-10",title:"Onboarding Profile Model dropdown",area:"Onboarding",impact:"Modify",effort:"M",pri:"P2",bucket:"state",
  what:"Grouped mapping dropdown (Identifiers / Demographics / Clinical / Providers / Tokens) using the de-identified field list; direct identifiers fall to “Do Not Map”.",
  why:"A flat list is unscannable; grouping reflects the real profile model. Confirm field list + token series with backend.",
  files:[["components/configWizard/ConfigWizardIngestionLayout.tsx","Onboarding mapping grid."],["components/configWizard/ConfigWizardIngestionColumn.tsx","Per-column mapping dropdown."],["components/configWizard/DataTypeSelectorComponent.tsx","Grouped option source."]],
  ds:["UiKit Select (grouped / optgroup)"],
  deps:[["Backend","Confirm de-identified field list + token series"]],
  ac:["Dropdown grouped by section","Direct identifiers default to Do Not Map","Field list matches the de-identified profile model"],
  proto:"Onboarding step → a column's mapping dropdown."},

 {id:"IMP-11",title:"Sharing as a detail tab",area:"Detail view",impact:"Modify",effort:"M",pri:"P2",bucket:"state",
  what:"Surface sharing in a detail tab with an in-tab “Share configuration” CTA that opens the existing site-select modal (transit/connect-key note, real API).",
  why:"Sharing is a post-create action, not a creation step.",
  files:[["components/configWizard/ShareConfigurationModal.tsx","Existing modal (postConfigShare)."],["components/configWizard/ConfigShareTable.tsx","Recipients list."],["components/configWizard/ConfigShareRow.tsx","Recipient row."],["components/configWizard/RevokeConfigShareModal.tsx","Revoke."],["views/ConfigurationsTask.tsx","Add a Sharing tab (detail-only)."]],
  ds:["Modal","UiKit.TableRow","UiKit.Button"],
  deps:[["IMP-03","Detail view"]],
  ac:["Sharing tab visible only in detail view","In-tab Share CTA opens the existing modal","Recipients list + revoke wired to the real API"],
  proto:"Detail → Sharing tab → Share configuration."},

 {id:"IMP-12",title:"Post-create landing",area:"Detail view",impact:"Modify",effort:"M",pri:"P2",bucket:"state",
  what:"After Create, land on the read-only detail view with a success banner (keep the existing next-steps content).",
  why:"A clear ‘done’ moment and onward path.",
  files:[["components/configWizard/NextStepsOnConfigCreationModal.tsx","Reuse next-steps content (CLI / guides / create table)."],["components/configWizard/ConfigSaver.tsx","On create success, route to read-only detail."],["views/ConfigurationsReadonlyRouteView.tsx","Landing target."]],
  ds:["UiKit AlertMessage","UiKit.Button"],
  deps:[["IMP-02","Create action"],["IMP-03","Read-only detail"]],
  ac:["Create lands on read-only detail with a success banner","Next-steps links preserved"],
  proto:"Finish create → success banner + detail view."},

 {id:"IMP-13",title:"Viewer = fully read-only",area:"Detail / permissions",impact:"Modify",effort:"S",pri:"P2",bucket:"state",
  what:"No-rights users see plain values, no edit affordances, no action-prompting warnings; Clone is the only action.",
  why:"Viewers shouldn't see controls they can't use.",
  files:[["views/ConfigurationsReadonlyRouteView.tsx","Force read-only render for viewers."],["components/configWizard/RowActionsMenuButton.tsx","isSharedToMe → View + Clone only."],["utils/users.ts","hasPortalAction / ability checks."]],
  ds:["UiKit.Button"],
  deps:[["IMP-24","Rights model"]],
  ac:["Viewers see plain values + Clone only","No edit affordances or creation warnings shown"],
  proto:"Open a shared-to-me config."},

 {id:"IMP-14",title:"Simplified wizard header",area:"Create wizard",impact:"Modify",effort:"S",pri:"P2",bucket:"pres",
  what:"Name · site · a single mode chip (replaces the dual capability flags) · Draft tag.",
  why:"The header should stay calm; counts/validation live elsewhere.",
  files:[["views/ConfigurationsTitle.tsx","Header layout: name, site, single mode chip, Draft tag."],["views/DeID/ConfigurationModeIcons.tsx","Single mode chip."]],
  ds:["UiKit Tag/Badge","UiKit.Text"],
  deps:[["IMP-01","Header shared with stepper"]],
  ac:["Header shows name, site, one mode chip, Draft tag","Dual capability flags removed"],
  proto:"Wizard header."},

 {id:"IMP-15",title:"Data type: Unspecified vs No values present",area:"Onboarding",impact:"Modify",effort:"S",pri:"P2",bucket:"pres",
  what:"Two distinct types — Unspecified (⚠ minimal scan) vs No values present (adds the Non-null check).",

  ds:["UiKit Tag/Badge"],
  deps:[["IMP-10","Same onboarding grid"]],
  ac:["Both types selectable and distinct","Unspecified shows ⚠ minimal-scan; No values present adds Non-null check"],
  proto:"Onboarding step → data-type chips."},

 {id:"IMP-16",title:"Hide pre-mapped note (onboarding-only)",area:"Onboarding",impact:"Modify",effort:"S",pri:"P3",bucket:"pres",

  ds:["UiKit.InfoBox"],
  deps:[["IMP-09","Initial-mode tracking"]],
  ac:["Note hidden when config began onboarding-only","Note still shown when input existed to infer from"],

 {id:"IMP-17",title:"Draft status → slate",area:"List view",impact:"Modify",effort:"S",pri:"P3",bucket:"pres",
  what:"Recolor the Draft badge + row accent from yellow to slate (yellow reserved for warnings).",

  ds:["UiKit Badge","DS color token"],
  deps:[["—",""]],
  ac:["Draft badge + row accent use slate","No yellow used for Draft status"],

 {id:"IMP-18",title:"Token count label + formatting",area:"List view",impact:"Modify",effort:"S",pri:"P3",bucket:"pres",
  what:"Add a “Tokens” label and locale thousands-separators to the count on the list.",
  why:"Raw unlabeled numbers are hard to parse.",
  files:[["components/configWizard/ConfigRow.tsx","generateTokenColumnCountStrings — add label + Intl formatting."],["api/countTokenColumns.ts","Count source."]],
  ds:["UiKit.Text"],
  deps:[["—",""]],
  ac:["Count shows a Tokens label","Numbers use locale thousands separators","Applies consistently across surfaces"],

 {id:"IMP-19",title:"Expose site filter to all users",area:"List view",impact:"Modify",effort:"S",pri:"P3",bucket:"pres",
  what:"The site filter currently shows only to Datavant-internal users; expose it more broadly (confirm with PM).",

  deps:[["PM","Confirm exposure"]],
  ac:["Site filter visible to non-internal users","Filters the table; composes with search"],

 {id:"IMP-20",title:"No drag-reorder in detail view",area:"Detail view",impact:"Modify",effort:"S",pri:"P3",bucket:"pres",
  what:"Column order is fixed once a config exists; reorder stays a creation-step action only.",

  files:[["components/configWizard/ConfigWizardInputLayout.tsx","Disable reorder when not creating."],["components/configWizard/ConfigWizardOutputLayout.tsx","Same."],["components/configWizard/ColumnNumField.tsx","Hide drag handle in detail/edit."]],

  deps:[["IMP-22","Drag handle lives here"]],

 {id:"IMP-21",title:"Token modal PII gating",area:"Output / tokens",impact:"Modify",effort:"M",pri:"P3",bucket:"state",

const DART = "https://github.com/datavant/dart/tree/main";

const IC_DL  = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M5 7l3 3 3-3M3 13.5h10" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const IC_EXT = '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 2.5h4.5V7" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.5 2.5L7.5 8.5" stroke-linecap="round"/><path d="M12 9.5V12a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 2 12V5a1.5 1.5 0 0 1 1.5-1.5H6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const RESOURCES = [
  { href: "config-page.html", name: "Configuration prototype", file: "config-page.html", dl: "config-page.html" }
];

/* ============================ RENDER ============================ */
const app = document.getElementById('app');
const PRI = id => "b-"+ (IMP.find(x=>x.id===id)||{}).pri?.toLowerCase();

function bucketBadge(b){const m=BUCKETS[b];return `<span class="badge ${m.cls}">${m.label}</span>`}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild}

function renderHub(filter){
  const items = IMP.filter(i=> !filter || filter==='all' || i.bucket===filter);
  app.innerHTML = `
   <div class="top">
     <div>
       <h1>Tokenization Config — Developer Hand-off</h1>
       <p>Navigable change → code map for each improvement. Open an item for the files to touch, the DART/UiKit components to use, dependencies, and acceptance criteria. The prototype shows intended behaviour only.</p>
     </div>
     <a class="proto-btn" href="${PROTO}" target="_blank" rel="noopener">▶ Open prototype</a>
   </div>
   <section class="resources">
     <div class="res-h">Downloadable resources</div>
     <div class="res-list">
       ${RESOURCES.map(r=>`<a class="res" href="${r.href}" download="${r.dl}">${IC_DL}<span class="res-name">${r.name}</span><span class="res-file">${r.file}</span></a>`).join('')}
     </div>
   </section>
   <p class="legend">Buckets — <b>Presentational</b>: maps onto existing components, low risk. <b>State / flow</b>: changes state/behaviour. <b>Cross-cutting</b>: needs an ADR before implementation. Click any card.</p>
   <div class="filters">
     ${['all','pres','state','cross'].map(f=>`<span class="chip ${ (filter||'all')===f?'active':''}" data-f="${f}">${f==='all'?'All ('+IMP.length+')':BUCKETS[f].label+' ('+IMP.filter(i=>i.bucket===f).length+')'}</span>`).join('')}
   </div>
   <div class="grid">
     ${items.map(i=>`
       <a class="card" href="#/${i.id}">
         ${(IMG[i.id]&&IMG[i.id].length)?`<img class="thumb" src="${IMG[i.id][0]}" alt="" loading="lazy"/>`:''}
         <div class="cid">${i.id}${JIRA[i.id]?` <span class="jira-chip">${JIRA[i.id]}</span>`:''}</div>
         <h3>${i.title}</h3>
         <div class="meta">
           <span class="badge b-area">${i.area}</span>
           <span class="badge ${PRI(i.id)}">${i.pri}</span>
           <span class="badge b-eff">${i.effort}</span>
           ${bucketBadge(i.bucket)}
         </div>
       </a>`).join('')}
   </div>`;
  app.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>renderHub(c.dataset.f)));
}

function depLink(d){
  const [ref,note]=d;
  const isImp=/^IMP-\d{2}$/.test(ref);
  const r = isImp ? `<a href="#/${ref}" class="file">${ref}</a>` : `<span class="file">${ref}</span>`;
  return `<li>${r}${note?' — '+note:''}</li>`;
}

function renderDetail(i){
  const isCross = i.bucket==='cross';
  app.innerHTML = `
   <div class="crumb"><a href="#/">← All improvements</a> &nbsp;/&nbsp; ${i.id}</div>
   <div class="detail-head">
     <div class="cid">${i.id}${JIRA[i.id]?` · <a class="jira" href="${JIRA_BASE}${JIRA[i.id]}" target="_blank" rel="noopener">${JIRA[i.id]} ↗</a>`:''}</div>
     <h2>${i.title}</h2>
     <div class="meta">
       <span class="badge b-area">${i.area}</span>
       <span class="badge ${PRI(i.id)}">Priority ${i.pri}</span>
       <span class="badge b-eff">Effort ${i.effort}</span>
       <span class="badge b-pres" style="background:#EEF2F7;color:#4A5568">Code: ${i.impact}</span>
       ${bucketBadge(i.bucket)}
     </div>
   </div>

   ${JIRA[i.id]?`<section class="blk jira-blk"><h4>Jira ticket</h4>
     <a class="jira-btn" href="${JIRA_BASE}${JIRA[i.id]}" target="_blank" rel="noopener">${JIRA[i.id]} — open in Jira ↗</a>
     <span class="jira-meta">Apps (Tokenization) · epic <a href="${JIRA_BASE}APP-3279" target="_blank" rel="noopener">APP-3279</a> · Team: Tokenization</span>
   </section>`:''}

   ${isCross?`<div class="callout cross"><b>Cross-cutting — needs an ADR first.</b> Agree the design decision before writing implementation tickets; otherwise it gets reinvented per file.</div><div style="height:14px"></div>`:''}

   ${(IMG[i.id]&&IMG[i.id].length)?`<section class="blk"><h4>Visual reference</h4>
     <div class="shots">${IMG[i.id].map(src=>`<a href="${src}" target="_blank" rel="noopener"><img class="shot" src="${src}" alt="${i.id} reference" loading="lazy"/></a>`).join('')}</div>
     <p style="margin-top:10px;color:var(--slate);font-size:12px">From the source doc. Click to open full size. Behaviour is live in the <a href="${PROTO}" target="_blank" rel="noopener">prototype</a>.</p>
   </section>`:''}

   <section class="blk"><h4>What changes</h4><p>${i.what}</p></section>
   <section class="blk"><h4>Why</h4><p>${i.why}</p></section>

   <section class="blk">
     <h4>Change → code map</h4>
     ${i.files.map(f=>{
        var p = f[0];
        var pathEl = isDS(p)
          ? `<a class="file file-link" href="${DART}" target="_blank" rel="noopener" title="Design System — opens the DART repo">${IC_EXT}${p}</a>`
          : `<span class="file">${p}</span>`;
        return `<div class="filerow">${pathEl}<span class="note">${f[1]}</span></div>`;
      }).join('')}
   </section>

   <section class="blk">
     <h4>DART / UiKit components to use</h4>
     <div>${i.ds.map(d=>`<a class="ds ds-link" href="${DART}" target="_blank" rel="noopener" title="Opens the DART design-system repo">${d} ↗</a>`).join('')}</div>
     <p style="margin-top:10px;color:var(--slate);font-size:13px">Build with these existing components (links → the DART repo). Do not port the prototype's CSS/markup.</p>
   </section>

   <section class="blk"><h4>Dependencies</h4><ul class="tight dep">${i.deps.map(depLink).join('')}</ul></section>

   <section class="blk"><h4>Acceptance criteria</h4><ul class="tight">${i.ac.map(a=>`<li>${a}</li>`).join('')}</ul></section>

   <section class="blk">
     <h4>Prototype reference</h4>
     <p style="color:var(--slate);font-size:13px;margin-bottom:10px">${i.proto}</p>
     <a class="protolink" href="${PROTO}" target="_blank" rel="noopener">▶ Open prototype</a>
   </section>`;
  window.scrollTo(0,0);
}

function route(){
  const h = location.hash.replace(/^#\//,'').trim();
  if(!h){ renderHub('all'); return; }
  const i = IMP.find(x=>x.id===h);
  if(i) renderDetail(i); else renderHub('all');
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
